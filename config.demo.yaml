project:
  name: demo_barge

mesh:
  path: meshes/demo_barge.obj
  scale_to_m: 1.0
  translation_m: [0.0, 0.0, 0.0]
  heal: true
  closed_mesh: true
  flip_normals: false
  lid:
    enabled: false
    faces_max_radius_m: null

body:
  center_of_mass_m: [0.0, 0.0, -0.25]
  mass_kg: null
  inertia_matrix_6x6: null
  hydrostatic_stiffness_6x6: null

environment:
  water_density_kg_m3: 1025.0
  gravity_m_s2: 9.81
  free_surface_z_m: 0.0
  water_depth_m: null

analysis:
  wave_period_s:
    min: 3.0
    max: 8.0
    count: 3
  wave_headings_deg: [0.0, 90.0]
  degrees_of_freedom: [Surge, Heave, Pitch]

response:
  roll_damping_target_percent: 0.0
  mooring_stiffness_diagonal: {}

solver:
  n_jobs: 1
  progress_bar: true
  log_level: INFO

output:
  directory: outputs/demo
